name: CI

on:
  push:
    branches:
      - dev
      - test
      - main
  pull_request:
    branches:
      - test
      - main

jobs:
  detect-projects:
    name: Detect projects
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project folders
        id: detect
        shell: bash
        run: |
          if [ -f backend/pom.xml ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: detect-projects
    if: needs.detect-projects.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests with Maven wrapper
        working-directory: backend
        run: ./mvnw test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: detect-projects
    if: needs.detect-projects.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - detect-projects
      - backend
      - frontend
    if: always()

    steps:
      - name: Validate CI result
        shell: bash
        run: |
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.frontend.result }}" = "failure" ]; then
            exit 1
          fi

          echo "CI completed successfully."
